name: Windows CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate packs
        shell: pwsh
        run: ./fusion-threads.ps1 validate
      - name: Run integration tests in Windows PowerShell 5.1
        shell: powershell
        run: .\tests\Run-Tests.ps1 -ChildEngine powershell
      - name: Run integration tests in PowerShell 7
        shell: pwsh
        run: ./tests/Run-Tests.ps1 -ChildEngine pwsh
